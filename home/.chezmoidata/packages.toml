# Homebrew (macOS). Installed by .chezmoiscripts/darwin/00-packages.
# Names only; no versions. bat, fd, oh-my-posh, tmux, gh, and the Nerd Font are
# listed here too so the bootstrap has one source of truth.
# Must stay last in the file: a TOML sub-table header owns every key that
# follows it, so apt and vscode_extensions have to be declared above it.
[packages.darwin]
brew = [
  "age",
  "bat",
  "bats-core",
  "bun",
  "chezmoi",
  "docker",
  "fd",
  "gh",
  "git-filter-repo",
  "gitleaks",
  "go",
  "gofumpt",
  "golangci-lint",
  "goreleaser",
  "htop",
  "jandedobbeleer/oh-my-posh/oh-my-posh",
  "jq",
  "lefthook",
  "pnpm",
  "postgresql",
  "ripgrep",
  "shellcheck",
  "tmux",
  "tree",
  "uv",
]
cask = [
  "claude",
  "dbeaver-community",
  "docker-desktop",
  "font-jetbrains-mono-nerd-font",
  "google-chrome",
  "obsidian",
  "ollama-app",
  "visual-studio-code",
]
