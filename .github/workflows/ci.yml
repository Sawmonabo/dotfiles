name: ci
on:
  push: {branches: [main, restructure]}
  pull_request:
permissions:
  contents: read
jobs:
  render-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        machine_role: [personal, work, both]
        versions_mode: [pinned, latest]
        extra: ['']
        exclude:
          # versions_mode only affects the Linux runtime scripts
          - os: macos-latest
            versions_mode: latest
        include:
          # The wsl/ scripts render empty on every other host, so lint them once
          # against a config that claims to be WSL.
          - os: ubuntu-latest
            machine_role: work
            versions_mode: pinned
            extra: wsl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi and shellcheck
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render, lint, and leak-check
        run: scripts/render-check.sh "${{ matrix.machine_role }}" "${{ matrix.versions_mode }}" "${{ matrix.extra }}"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
